name: Release APK

# Publish a GitHub Release (tag like v1.0.0) and this attaches the installable APK to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (if the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - building with the debug key. See README > Releasing."
          fi

      - name: Build release APK
        run: |
          TAG="${{ github.event.release.tag_name }}"
          ./gradlew assembleRelease --stacktrace \
            -PappVersion="${TAG#v}" -PappVersionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/*.apk "MacroBot-${TAG}.apk"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "MacroBot-${{ github.event.release.tag_name }}.apk" --clobber
